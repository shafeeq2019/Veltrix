name: Diag
on:
  push:
    branches: ["ccr-cd915f7a-py7wh8"]
jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p odm-core --example fetch
      - name: 1 GB (OVH)
        shell: bash
        env: { ODM_LOG: "odm_core=debug,reqwest=debug,hyper_util=debug" }
        run: timeout 120 target/debug/examples/fetch https://proof.ovh.net/files/1Gb.dat 60 || true
      - name: 10 GB (OVH) first 60 s
        shell: bash
        env: { ODM_LOG: "odm_core=debug" }
        run: timeout 120 target/debug/examples/fetch https://proof.ovh.net/files/10Gb.dat 60 || true
      - name: Ubuntu ISO first 60 s
        shell: bash
        env: { ODM_LOG: "odm_core=debug" }
        run: timeout 120 target/debug/examples/fetch https://releases.ubuntu.com/24.04/ubuntu-24.04.3-desktop-amd64.iso 60 || true
