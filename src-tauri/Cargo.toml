[package]
name = "opendownload-manager"
description = "OpenDownload Manager – free, open source download manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "opendownload-manager"

[lib]
name = "opendownload_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
odm-core = { path = "../crates/odm-core" }
odm-ipc = { path = "../crates/odm-ipc", features = ["server"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-single-instance = "2.5"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
