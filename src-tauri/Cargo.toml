[package]
name = "veltrix"
description = "Veltrix – free, open source download manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "veltrix"

[lib]
name = "veltrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
odm-core = { path = "../crates/odm-core" }
odm-ipc = { path = "../crates/odm-ipc", features = ["server"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-single-instance = "2.5"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid.workspace = true
url.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
