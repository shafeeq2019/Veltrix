<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>OpenDownload Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="20" height="20" alt="" />
      <h1>OpenDownload Manager</h1>
    </header>
    <section id="status" class="status" role="status">Prüfe Verbindung…</section>
    <label class="row">
      <span>
        <strong>Download-Erkennung</strong>
        <small>Im Browser gestartete Downloads an die App übergeben</small>
      </span>
      <input type="checkbox" id="enabled" />
    </label>
    <label class="row">
      <span>
        <strong>Cookies mitsenden</strong>
        <small>Nur für übernommene Downloads, für Seiten mit Anmeldung. Fragt nach Berechtigung.</small>
      </span>
      <input type="checkbox" id="cookies" />
    </label>
    <p id="last" class="muted"></p>
    <p class="muted">Dateitypen, Ausnahmen und automatische Übernahme stellst du in der Desktop-App unter Einstellungen → Browser ein.</p>
    <script src="popup.js"></script>
  </body>
</html>
