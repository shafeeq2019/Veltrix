<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Veltrix</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="20" height="20" alt="" />
      <h1>Veltrix</h1>
    </header>
    <section id="status" class="status" role="status" data-i18n="popupChecking"></section>
    <label class="row">
      <span>
        <strong data-i18n="popupCaptureTitle"></strong>
        <small data-i18n="popupCaptureHint"></small>
      </span>
      <input type="checkbox" id="enabled" />
    </label>
    <label class="row">
      <span>
        <strong data-i18n="popupCookiesTitle"></strong>
        <small data-i18n="popupCookiesHint"></small>
      </span>
      <input type="checkbox" id="cookies" />
    </label>
    <p id="last" class="muted"></p>
    <p class="muted" data-i18n="popupSettingsHint"></p>
    <script src="popup.js"></script>
  </body>
</html>
