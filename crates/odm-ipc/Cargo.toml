[package]
name = "odm-ipc"
description = "Typed protocol and local IPC transport between browser extension, native messaging host and the OpenDownload Manager app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Async server side (used by the desktop app).
server = ["dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
tokio = { workspace = true, optional = true }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
